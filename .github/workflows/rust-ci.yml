name: Rust CI

on:
  push:
    branches:
      - main
      - plan/**
  pull_request:

jobs:
  deployment-security:
    name: Deployment security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage fixture bundle
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "output/rpi-aarch64"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "scripts/lib") | Out-Null
          Copy-Item scripts/lib/secure-env.sh (Join-Path $stage "scripts/lib/secure-env.sh")
          foreach ($name in @("prod-bootstrap.sh", "prod-dashboard.sh", "prod-bot.sh", "remote-rpi-postdeploy.sh")) {
            Copy-Item (Join-Path "scripts" $name) (Join-Path $stage "scripts/$name")
          }
          if ($env:RUNNER_OS -ne "Windows") {
            Get-ChildItem (Join-Path $stage "scripts") -Filter "*.sh" -Recurse | ForEach-Object {
              chmod +x $_.FullName
            }
          }

      - name: Verify secure environment creation and Bash bundle contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/tests/test-secure-env.sh
          bash scripts/tests/test-rpi-security-bundle.sh output/rpi-aarch64
          bash scripts/tests/test-rpi-security-bundle.sh --self-test

      - name: Verify PowerShell bundle contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/tests/Test-RpiSecurityBundle.ps1 -StageDir output/rpi-aarch64
          pwsh -NoProfile -File scripts/tests/Test-RpiSecurityBundle.ps1 -SelfTest

  mongo-isolation:
    name: MongoDB 7 isolation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify isolated Mongo runner contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/scripts/mongo-isolation-contract.ps1

      - name: Run isolated Mongo integration tests
        shell: pwsh
        env:
          DYNAMO_MONGO_TEST: '1'
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          MONGODB_URI: mongodb://127.0.0.1:27018/?directConnection=true
        run: pwsh -NoProfile -File scripts/test-isolated-mongo.ps1

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compile workspace
        run: cargo check --workspace --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked
